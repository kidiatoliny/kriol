name: macOS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  WASI_SDK_VERSION: '27'
  STAGE: kriol-macos-arm64

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: brew install llvm@20 flex bison cmake zstd

      - name: Add LLVM 20, bison and flex to PATH
        run: |
          echo "$(brew --prefix llvm@20)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      # Homebrew has no WASI sysroot or wasm32 builtins for llvm@20.
      - name: Cache WASI sysroot and builtins
        id: cache-wasi
        uses: actions/cache@v5
        with:
          path: ~/wasi
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}

      - name: Download WASI sysroot and builtins
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION"
          mkdir -p ~/wasi
          curl -fsSL "$base/wasi-sysroot-$WASI_SDK_VERSION.0.tar.gz" | tar -xz -C ~/wasi
          curl -fsSL "$base/libclang_rt-$WASI_SDK_VERSION.0.tar.gz" | tar -xz -C ~/wasi

      - name: Install WASI builtins into clang
        run: |
          builtins=~/wasi/libclang_rt-$WASI_SDK_VERSION.0/wasm32-unknown-wasi/libclang_rt.builtins.a
          resource_dir=$(clang-20 -print-resource-dir)
          mkdir -p "$resource_dir/lib/wasm32-unknown-wasi" "$resource_dir/lib/wasi"
          cp "$builtins" "$resource_dir/lib/wasm32-unknown-wasi/libclang_rt.builtins.a"
          cp "$builtins" "$resource_dir/lib/wasi/libclang_rt.builtins-wasm32.a"
          clang-20 --target=wasm32-wasi --print-libgcc-file-name

      - name: Build and test
        run: |
          cmake -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DKRIOL_WASI_SYSROOT="$HOME/wasi/wasi-sysroot-$WASI_SDK_VERSION.0" \
            -DCMAKE_INSTALL_BINDIR=. \
            -DCMAKE_INSTALL_DOCDIR=.

          cmake --build build/release --target check

      - name: Stage artifact
        run: cmake --install build/release --prefix "$STAGE"

      # The archive must run on a Mac without Homebrew.
      - name: Check for Homebrew dylibs
        run: |
          otool -L "$STAGE/kriol"
          if otool -L "$STAGE/kriol" | grep -q "$(brew --prefix)"; then
            echo "kriol links against Homebrew libraries" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: kriol-macos-arm64
          path: ${{ env.STAGE }}
